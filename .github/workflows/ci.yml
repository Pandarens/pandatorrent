name: CI

# Runs on every push and pull request. A release tag goes through release.yml;
# this is what has to be green before one is worth cutting.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # One command per step: in a multi-line PowerShell step only the last
      # command's exit code counts, so a failing typecheck followed by passing
      # tests would have shown green.
      - name: Typecheck the interface
        run: npm run typecheck

      - name: Unit-test the interface
        run: npm run test

      # The Rust build embeds the built interface, so it has to exist first.
      - name: Build the interface
        run: npm run build

      # tauri-build refuses to compile unless every file listed under
      # bundle.resources exists — including libmpv, which is not committed.
      # The release job downloads the real one; the tests never load it, so
      # an empty stand-in satisfies the check without a 115 MB download and a
      # rate-limited API call on every push.
      - name: Stand in for libmpv
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources/mpv | Out-Null
          New-Item -ItemType File -Force src-tauri/resources/mpv/libmpv-2.dll | Out-Null

      # Unit tests of every decision plus the end-to-end smoke test: a real
      # engine over real files, the stream server, the database.
      - name: Test the core
        run: cargo test --manifest-path src-tauri/Cargo.toml
