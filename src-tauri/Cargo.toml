[package]
name = "panda-torrent"
version = "0.1.0"
description = "Panda Torrent - fast torrent client with tracker integration"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "panda_torrent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `unstable` unlocks plain (webview-less) windows, which is how mpv gets an HWND
# to render into. Documented-but-unstable API: pin tauri when upgrading.
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "protocol-asset", "unstable"] }
tauri-plugin-log = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "signal"] }
librqbit = { version = "9.0.1", default-features = false, features = ["default-tls"] }
reqwest = { version = "0.13.4", default-features = false, features = ["default-tls", "cookies", "gzip", "json", "charset", "stream", "socks", "system-proxy"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
encoding_rs = "0.8.35"
scraper = "0.27.0"
chrono = { version = "0.4.45", features = ["serde"] }
url = "2.5.8"
hex = "0.4.3"
parking_lot = "0.12.5"
regex = "1.13.1"
futures = "0.3.34"
percent-encoding = "2.3.2"
tracing = "0.1.44"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "serde_json"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
base64 = "0.23.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
tokio-util = { version = "0.7.19", features = ["io"] }
libloading = "0.8.9"
ego-tree = "0.11.0"
bytes = "1.12.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Dependencies stay optimised even in dev builds: hashing/crypto is unusable
# at opt-level 1 and the UI feels broken while a torrent is being verified.
[profile.dev.package."*"]
opt-level = 3
